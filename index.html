<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>נגריית טאלב אמארה — מטבחים וארונות בהתאמה אישית</title>
    <meta
      name="description"
      content="תיק עבודות של מטבחי עץ, חדרי הלבשה ונגרות אדריכלית. ללא מחירים."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip">דלג לתוכן</a>

    <header class="site-header" data-header>
      <div class="site-header__inner">
        <a class="logo" href="#top">
          <span class="logo__mark" aria-hidden="true"></span>
          <span data-i18n="brandShort">טאלב אמארה</span>
        </a>
        <div class="header-tools">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-switch__btn is-active" data-set-lang="he">עברית</button>
            <button type="button" class="lang-switch__btn" data-set-lang="ar">العربية</button>
          </div>
          <nav class="nav" aria-label="Primary">
            <a href="#portfolio" data-i18n="navPortfolio">תיק עבודות</a>
            <a href="#process" data-i18n="navProcess">תהליך</a>
            <a href="#materials" data-i18n="navMaterials">חומרים</a>
            <a href="#consult" class="nav__cta" data-i18n="navConsult">ייעוץ</a>
          </nav>
          <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="mobile-nav"
            data-nav-toggle
          >
            <span class="sr-only" data-i18n="menu">תפריט</span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <nav id="mobile-nav" class="mobile-nav" data-mobile-nav hidden>
        <a href="#portfolio" data-i18n="navPortfolio">תיק עבודות</a>
        <a href="#process" data-i18n="navProcess">תהליך</a>
        <a href="#materials" data-i18n="navMaterials">חומרים</a>
        <a href="#consult" data-i18n="navConsult">ייעוץ</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" id="top">
        <div class="hero__media" aria-hidden="true">
          <img data-hero-image src="" alt="" width="2400" height="1350" fetchpriority="high" />
          <div class="hero__veil"></div>
        </div>
        <div class="hero__content">
          <p class="hero__brand" data-i18n="brand">נגריית טאלב אמארה</p>
          <h1 class="hero__title" data-i18n="heroTitle"></h1>
          <p class="hero__lede" data-i18n="heroLede"></p>
          <div class="hero__actions">
            <a class="btn btn--primary" href="#portfolio" data-i18n="ctaPortfolio"></a>
            <a class="btn btn--ghost" href="#consult" data-i18n="ctaConsult"></a>
          </div>
        </div>
      </section>

      <section class="section featured" id="featured">
        <div class="section__intro">
          <p class="eyebrow" data-i18n="featuredEyebrow"></p>
          <h2 data-i18n="featuredTitle"></h2>
          <p data-i18n="featuredLede"></p>
        </div>
        <div class="featured__grid" data-featured-grid></div>
      </section>

      <section class="section gallery" id="portfolio">
        <div class="section__intro">
          <p class="eyebrow" data-i18n="galleryEyebrow"></p>
          <h2 data-i18n="galleryTitle"></h2>
          <p data-i18n="galleryLede"></p>
        </div>
        <div class="filters" role="tablist" data-filters>
          <button type="button" class="filter is-active" data-filter="all" data-i18n="filterAll"></button>
          <button type="button" class="filter" data-filter="kitchens" data-i18n="filterKitchens"></button>
          <button type="button" class="filter" data-filter="wardrobes" data-i18n="filterWardrobes"></button>
          <button type="button" class="filter" data-filter="cladding" data-i18n="filterCladding"></button>
          <button type="button" class="filter" data-filter="office" data-i18n="filterOffice"></button>
          <button type="button" class="filter" data-filter="furniture" data-i18n="filterFurniture"></button>
        </div>
        <div class="gallery__grid" data-gallery></div>
      </section>

      <dialog class="project-dialog" data-dialog>
        <div class="project-dialog__inner">
          <button type="button" class="project-dialog__close" data-dialog-close data-i18n="close"></button>
          <div class="project-dialog__gallery">
            <div class="ba" data-ba>
              <img class="ba__after" data-dialog-after src="" alt="" width="1600" height="1000" />
              <img class="ba__before" data-dialog-before src="" alt="" width="1600" height="1000" />
              <label class="ba__control">
                <span class="sr-only">Before / After</span>
                <input type="range" min="0" max="100" value="50" data-ba-range />
              </label>
              <span class="ba__label ba__label--before" data-i18n="before"></span>
              <span class="ba__label ba__label--after" data-i18n="after"></span>
            </div>
            <div class="macro-row" data-dialog-macros></div>
          </div>
          <div class="project-dialog__body">
            <p class="eyebrow" data-dialog-category></p>
            <h2 data-dialog-title></h2>
            <p data-dialog-copy></p>
            <dl class="specs">
              <div>
                <dt data-i18n="material"></dt>
                <dd data-dialog-material></dd>
              </div>
              <div>
                <dt data-i18n="finish"></dt>
                <dd data-dialog-finish></dd>
              </div>
              <div>
                <dt data-i18n="hardware"></dt>
                <dd data-dialog-hardware></dd>
              </div>
              <div>
                <dt data-i18n="style"></dt>
                <dd data-dialog-style></dd>
              </div>
            </dl>
          </div>
        </div>
      </dialog>

      <section class="section process" id="process">
        <div class="section__intro">
          <p class="eyebrow" data-i18n="processEyebrow"></p>
          <h2 data-i18n="processTitle"></h2>
          <p data-i18n="processLede"></p>
        </div>
        <ol class="timeline" data-timeline>
          <li style="--i: 0">
            <span class="timeline__index">01</span>
            <h3 data-i18n="step1Title"></h3>
            <p data-i18n="step1Copy"></p>
          </li>
          <li style="--i: 1">
            <span class="timeline__index">02</span>
            <h3 data-i18n="step2Title"></h3>
            <p data-i18n="step2Copy"></p>
          </li>
          <li style="--i: 2">
            <span class="timeline__index">03</span>
            <h3 data-i18n="step3Title"></h3>
            <p data-i18n="step3Copy"></p>
          </li>
          <li style="--i: 3">
            <span class="timeline__index">04</span>
            <h3 data-i18n="step4Title"></h3>
            <p data-i18n="step4Copy"></p>
          </li>
        </ol>
      </section>

      <section class="section materials" id="materials">
        <div class="section__intro">
          <p class="eyebrow" data-i18n="materialsEyebrow"></p>
          <h2 data-i18n="materialsTitle"></h2>
          <p data-i18n="materialsLede"></p>
        </div>
        <div class="swatches">
          <figure class="swatch">
            <div class="swatch__chip swatch__chip--oak" aria-hidden="true"></div>
            <figcaption>
              <h3 data-i18n="swatchOak"></h3>
              <p data-i18n="swatchOakCopy"></p>
            </figcaption>
          </figure>
          <figure class="swatch">
            <div class="swatch__chip swatch__chip--walnut" aria-hidden="true"></div>
            <figcaption>
              <h3 data-i18n="swatchWalnut"></h3>
              <p data-i18n="swatchWalnutCopy"></p>
            </figcaption>
          </figure>
          <figure class="swatch">
            <div class="swatch__chip swatch__chip--smoked" aria-hidden="true"></div>
            <figcaption>
              <h3 data-i18n="swatchSmoked"></h3>
              <p data-i18n="swatchSmokedCopy"></p>
            </figcaption>
          </figure>
          <figure class="swatch">
            <div class="swatch__chip swatch__chip--lacquer" aria-hidden="true"></div>
            <figcaption>
              <h3 data-i18n="swatchLacquer"></h3>
              <p data-i18n="swatchLacquerCopy"></p>
            </figcaption>
          </figure>
          <figure class="swatch">
            <div class="swatch__chip swatch__chip--hardware" aria-hidden="true"></div>
            <figcaption>
              <h3 data-i18n="swatchHardware"></h3>
              <p data-i18n="swatchHardwareCopy"></p>
            </figcaption>
          </figure>
          <figure class="swatch">
            <div class="swatch__chip swatch__chip--ash" aria-hidden="true"></div>
            <figcaption>
              <h3 data-i18n="swatchAsh"></h3>
              <p data-i18n="swatchAshCopy"></p>
            </figcaption>
          </figure>
        </div>
      </section>

      <section class="section consult" id="consult">
        <div class="consult__layout">
          <div class="consult__intro">
            <p class="eyebrow" data-i18n="consultEyebrow"></p>
            <h2 data-i18n="consultTitle"></h2>
            <p data-i18n="consultLede"></p>
            <div class="consult__direct">
              <a
                class="btn btn--whatsapp"
                href="https://wa.me/972526619360"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="whatsapp"
              ></a>
              <p class="consult__phone">
                <a href="tel:+972526619360">052-661-9360</a>
              </p>
              <div class="consult__meta">
                <p>
                  <strong data-i18n="workshop"></strong><br />
                  <span data-i18n="workshopAddr"></span>
                </p>
                <p>
                  <strong data-i18n="hours"></strong><br />
                  <span data-i18n="hoursVal"></span>
                </p>
              </div>
              <div class="map">
                <iframe
                  title="map"
                  data-map-frame
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  src="https://maps.google.com/maps?q=Salah%20al-Din%2024%2C%20Kafr%20Kanna&t=&z=16&ie=UTF8&iwloc=&output=embed"
                ></iframe>
              </div>
            </div>
          </div>

          <form class="consult-form" data-form novalidate>
            <div class="field">
              <label for="name" data-i18n="labelName"></label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="phone" data-i18n="labelPhone"></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" required />
            </div>
            <div class="field">
              <label for="city" data-i18n="labelCity"></label>
              <input id="city" name="city" type="text" required />
            </div>
            <div class="field">
              <label for="type" data-i18n="labelType"></label>
              <select id="type" name="type" required>
                <option value="" data-i18n="typePlaceholder"></option>
                <option value="kitchen" data-i18n="typeKitchen"></option>
                <option value="wardrobe" data-i18n="typeWardrobe"></option>
                <option value="cladding" data-i18n="typeCladding"></option>
                <option value="office" data-i18n="typeOffice"></option>
                <option value="furniture" data-i18n="typeFurniture"></option>
                <option value="other" data-i18n="typeOther"></option>
              </select>
            </div>
            <div class="field">
              <label for="files" data-i18n="labelFiles"></label>
              <input id="files" name="files" type="file" accept="image/*,.pdf" multiple />
              <p class="field__hint" data-i18n="fileHint"></p>
            </div>
            <div class="field">
              <label for="message"
                ><span data-i18n="labelMessage"></span>
                <span class="optional" data-i18n="optional"></span
              ></label>
              <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <button class="btn btn--primary" type="submit" data-i18n="submit"></button>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="logo" data-i18n="brandShort"></p>
        <p data-i18n="footerNote"></p>
        <p class="site-footer__fine">
          &copy; <span data-year></span> <span data-i18n="footerCopy"></span>
        </p>
        <p class="site-footer__admin">
          <a href="admin.html">ניהול תמונות / إدارة الصور</a>
        </p>
      </div>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
